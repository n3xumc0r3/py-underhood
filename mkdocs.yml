site_name: Python под капотом
site_description: >-
  От синтаксических трюков до internals CPython.
  Книга о редко используемых, скрытых и продвинутых возможностях Python.
site_author: "@n3xumc0r3"
site_url: https://n3xumc0r3.github.io/

# Repo block в header выключен осознанно: блок репо + Edit/View кнопки
# ломали чистый header. Ссылка на GitHub остаётся в footer через extra.social.
# PRs идут через GitHub UI напрямую: github.com/n3xumc0r3/py-underhood/pulls

docs_dir: book
site_dir: site

theme:
  name: material
  language: ru
  custom_dir: overrides
  features:
    # Book-style navigation: prev/next at the bottom of every page,
    # flat sidebar (no nested tabs), right-side TOC follows scroll.
    - navigation.prev_next         # ← ключевой флаг: "книжная" пагинация
    - navigation.top               # кнопка "наверх" в правом нижнем углу
    - navigation.tracking          # URL обновляется при скролле по якорям
    - navigation.indexes           # index.md как точка входа (без дубля в sidebar)
    - toc.follow                   # правый TOC следует за скроллом
    - search.suggest               # подсказки в поиске
    - search.highlight             # подсветка в результатах поиска
    - content.code.copy            # кнопка "копировать" у блоков кода
    - content.code.annotate        # аннотации # (1)
    - content.tooltips             # hover-tooltips на сносках/ссылках
    # content.action.edit / content.action.view — выключены осознанно:
    # кнопки карандаша и глаза ломали чистый header. PRs идут через GitHub UI.
  # NO navigation.tabs / sections / expand — flat sidebar by default
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white              # explicitly white, not the default indigo
      accent: green               # electric green for links / hover
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  # NO logo — Material icon font may not load reliably on first deploy.
  # Site title ("Python под капотом") is enough.
  icon:
    repo: fontawesome/brands/github
  favicon: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Ctext%20y%3D%2218%22%20font-size%3D%2218%22%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.mark

plugins:
  - search:
      lang:
        - ru
        - en
      # Широкий разделитель: разбивает по любому не-буквенному символу,
      # включая запятые, двоеточия, скобки, точки с запятой, и т.д.
      # Без этого в индексе слова хранятся с прилипшей пунктуацией
      # ('операторы,' != 'операторы') и поиск по русскому не работает.
      separator: '[^\wа-яёА-ЯЁ]+'
      # Pipeline: только stopWordFilter. Стеммер НЕ включаем — lunr.py (Python)
      # не имеет русского стеммера, и pipeline: stemmer применит только английский,
      # ломая поиск на русском (запросы возвращают одинаковые нерелевантные результаты).
      # Точный поиск по словам работает корректно.
      pipeline:
        - stopWordFilter
  - tags

# Custom CSS — rounded corners, stretched content, Obsidian-style links
extra_css:
  - stylesheets/extra.css

# Custom JS — ⚠️ warning highlighter
extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/n3xumc0r3/py-underhood
      name: GitHub репозиторий
  generator: false

nav:
  - 'Главная': index.md
  - 'Часть I. Базовые скрытые особенности': 01-basics.md
  - 'Часть II. Контекстные менеджеры': 02-context-managers.md
  - 'Часть III. Генераторы и итераторы': 03-generators.md
  - 'Часть IV. Асинхронность': 04-async.md
  - 'Часть V. Классы и интерфейсы': 05-classes.md
  - 'Часть VI. Дескрипторы и property': 06-descriptors.md
  - 'Часть VII. Метапрограммирование': 07-metaprogramming.md
  - 'Часть VIII. Внутренности CPython': 08-cpython-internals.md
  - 'Часть IX. Кодировки и кодеки': 09-encodings.md
  - 'Часть X. Интроспекция окружения': 10-introspection.md
  - 'Часть XI. Полезные модули stdlib': 11-stdlib.md
  - 'Часть XII. Линтеры и директивы': 12-linters.md
  - 'Часть XIII. От .py к байт-коду: компиляция и виртуальная машина': 13-bytecode-vm.md
  - 'Часть XIV. Не только CPython: кто ещё исполняет Python': 14-implementations.md
  - 'Приложения':
      - 'A. Системы обнаружения плагиата': appendix-a-plagiarism.md
      - 'B. Взаимодействие с системами проверки кода': appendix-b-code-checkers.md
      - 'C. Code golf': appendix-c-code-golf.md
      - 'D. Где почитать': appendix-d-references.md
